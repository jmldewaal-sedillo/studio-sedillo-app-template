name: Testen en publiceren

# Elke push: de tests draaien.
# Push naar main: zijn de tests groen, dan wordt er gepubliceerd op GitHub Pages, maar alleen:
#   repo <naam>-test   -> de testversie op https://jmldewaal-sedillo.github.io/<naam>-test/ (noindex)
#   repo <naam>        -> de webversie, pas als web.live in bouw.config.json aan staat ("lanceren web")
# tools/bouw.mjs beslist dat. De app (Android en iOS) komt uit app.yml; de portal-zips komen niet uit een workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      template: ${{ steps.soort.outputs.template }}
      publiceren: ${{ steps.soort.outputs.publiceren }}
    steps:
      - uses: actions/checkout@v4

      - name: Template of app?
        id: soort
        run: |
          if [ -f .template ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"; echo "publiceren=false" >> "$GITHUB_OUTPUT"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
            echo "publiceren=$(node tools/bouw.mjs moet-publiceren "${{ github.event.repository.name }}")" >> "$GITHUB_OUTPUT"
          fi

      # Vangnet: geen privégegevens (huisadres) online. De lijst komt uit het geheim
      # PRIVATE_BLOCKLIST en wordt nooit getoond. Ontbreekt het geheim bij een push, dan stopt de run:
      # zonder lijst controleert deze stap niets. (Pull requests van buiten krijgen geen geheimen.)
      - name: Controle op privégegevens
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: |
          if [ -z "$PRIVATE_BLOCKLIST" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Het geheim PRIVATE_BLOCKLIST ontbreekt in deze repo. Zet het met Apps/tools/sync-blocklist.sh."
            exit 1
          fi
          python3 tests/no-private-data.py --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Installeer Playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Playwright-tests
        run: npm test

      - name: Upload screenshots en rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresultaat
          path: |
            tests/screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Publiceren op GitHub Pages
    needs: test
    # Alleen main, alleen als de tests groen zijn, nooit vanuit de template, en alleen als
    # tools/bouw.mjs zegt dat deze repo iets publiceert (de test-repo, of web.live).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.outputs.template == 'false' && needs.test.outputs.publiceren == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Site klaarzetten (testversie of webversie, naar gelang de repo)
        run: node tools/bouw.mjs pages "${{ github.event.repository.name }}" "$GITHUB_SHA"

      # Zelf inpakken in plaats van actions/upload-pages-artifact: die laat bestanden
      # die met een punt beginnen weg (.nojekyll).
      - name: Inpakken
        run: tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Adres in de samenvatting
        run: echo "Gepubliceerd op ${{ steps.deployment.outputs.page_url }} (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
